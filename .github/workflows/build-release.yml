name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate plugin.js syntax
        run: |
          # node --check on a .js containing ESM syntax silently passes even when
          # the file is broken; force ESM parsing via .mjs so regressions fail CI.
          cp desktop/bot-horizon/plugin.js /tmp/plugin-check.mjs
          node --check /tmp/plugin-check.mjs
          echo "plugin.js syntax OK"

      - name: Validate manifest
        run: |
          python3 -c "import json; json.load(open('gateway/bot-horizon/dashboard/manifest.json'))"
          echo "manifest OK"

      - name: Build zip
        run: |
          mkdir -p dist/bot-horizon
          cp -r desktop gateway README.md LICENSE CONTRIBUTING.md SECURITY.md dist/bot-horizon/
          cd dist && zip -r ../bot-horizon.zip bot-horizon

      - name: Read version from manifest
        id: version
        run: |
          V="$(python3 -c "import json; print(json.load(open('gateway/bot-horizon/dashboard/manifest.json'))['version'])")"
          # normalize to vX.Y.Z
          V="v${V#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Will release: $V"

      - name: Create or update GitHub release (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" bot-horizon.zip --clobber
            echo "✅ Updated release $TAG with fresh zip"
          else
            gh release create "$TAG" bot-horizon.zip \
              --title "Bot Horizon $TAG" \
              --target main \
              --generate-notes \
              --latest
            echo "✅ Created release $TAG"
          fi
